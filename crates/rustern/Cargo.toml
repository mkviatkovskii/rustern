[package]
name = "rustern"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only FUSE client for TernFS"
publish = false

[lints]
workspace = true

[dependencies]
rustern-client.workspace = true
rustern-fuse.workspace = true
fuser.workspace = true
bytesize.workspace = true
clap.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
rustix.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# 2 MiB FUSE reads instead of 1 MiB: 2 MiB + 8 KiB read buffers, `max_write` 2 MiB. Takes
# effect only where root has set `fs.fuse.max_pages_limit` >= 512; otherwise the kernel keeps
# requests at 1 MiB (the buffers are then half used).
read2m = ["rustern-client/read2m"]

[dev-dependencies]
fastrand.workspace = true
rustern-core.workspace = true
