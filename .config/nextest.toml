[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
cluster-serial = { max-threads = 1 }

[[profile.default.overrides]]
# nextest rejects binary() filters that match no built binary, so fault tests are
# grouped by module name instead: every test in faults.rs and relay_faults.rs lives
# in `mod cluster_serial`.
filter = "test(/^cluster_serial::/)"
test-group = "cluster-serial"
