[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[workspace.dependencies]
rustern-msgs = { path = "crates/rustern-msgs" }
rustern-core = { path = "crates/rustern-core" }
rustern-client = { path = "crates/rustern-client" }
rustern-fuse = { path = "crates/rustern-fuse" }

fuser = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "io-util"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
dashmap = "6"
deadpool = { version = "0.13", default-features = false, features = ["managed"] }
memmap2 = "0.9"
backon = { version = "1", default-features = false, features = ["std"] }
fastrand = "2"
moka = { version = "0.12", features = ["future"] }
crc32c = "0.6"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
bytesize = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
rustix = { version = "1", features = ["fs", "process"] }

proptest = "1"
criterion = "0.8"
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
dhat = "0.3"
