# Runs scripts/gate.sh, the same merge gate as locally:
#   quick: lints, unit tests, cargo-deny, codec drift (no cluster)
#   full:  everything, plus fuzz smoke, the cluster and fault suites against a local
#          upstream cluster, and the coverage floor
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quick:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # shellcheck annotations
      pull-requests: write # shellcheck review comments
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # ternfs/, upstream at the pinned commit
      # Under Actions the gate leaves shellcheck (0.11.0) to this step: inline review
      # comments on pull requests, check annotations on pushes; any finding fails the job.
      - uses: reviewdog/action-shellcheck@v1.35.1
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          path: scripts
          level: info
          filter_mode: nofilter
          fail_level: any
      - run: sudo apt-get update -q && sudo apt-get install -yq fuse3
      # The toolchain from rust-toolchain.toml; warnings as the local gate treats them
      # (clippy denies them).
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      # The latest Go: tools/go.mod only sets the minimum, and shfmt needs a newer one.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: tools/go.mod
      - uses: astral-sh/setup-uv@v10.3.3 # no major tags since v8
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: scripts/gate.sh --quick

  full:
    runs-on: ubuntu-26.04
    # The first run on a new pin also builds upstream (cached afterwards).
    timeout-minutes: 150
    steps:
      - name: Free disk space
        # The cluster wants 20 GB free; the runner image's SDKs take most of the disk.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Upstream pin
        id: pin
        run: echo "rev=$(git rev-parse HEAD:ternfs)" >>"$GITHUB_OUTPUT"
      # Restore and save separately: the build (about 10 min) is cached even when the gate fails.
      - name: Upstream binaries (restore)
        id: upstream
        uses: actions/cache/restore@v6
        with:
          path: ternfs/build/alpine
          key: ternfs-alpine-${{ steps.pin.outputs.rev }}
      - name: Upstream binaries (build)
        if: steps.upstream.outputs.cache-hit != 'true'
        run: MAKE_PARALLELISM=$(nproc) ternfs/build.sh alpine
      - name: Upstream binaries (save)
        if: steps.upstream.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ternfs/build/alpine
          key: ternfs-alpine-${{ steps.pin.outputs.rev }}
      - name: FUSE and user namespaces
        # allow_other is mandatory for rustern; the namespace test covers unmounting as root.
        run: |
          sudo apt-get update -q && sudo apt-get install -yq fuse3
          # GNU coreutils: uutils' sha256sum -c cannot open non-UTF-8 names (the corpus has some).
          sudo apt-get install -yq --allow-remove-essential coreutils-from-gnu coreutils-from-uutils-
          [[ -e /dev/fuse ]] || sudo modprobe fuse
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Ubuntu's fusermount3 AppArmor profile denies mounts under the workspace.
          if [[ -e /etc/apparmor.d/fusermount3 ]]; then sudo apparmor_parser -R /etc/apparmor.d/fusermount3; fi
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
          components: llvm-tools-preview
          cache-workspaces: |
            .
            crates/rustern-msgs/fuzz
            crates/rustern-client/fuzz
      - name: Nightly (cargo-fuzz)
        run: rustup toolchain install nightly --profile minimal
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: tools/go.mod
      - uses: astral-sh/setup-uv@v10.3.3 # no major tags since v8
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-llvm-cov,cargo-fuzz
      - run: scripts/gate.sh
      - name: AppArmor denials
        if: failure()
        run: sudo dmesg | grep -i 'apparmor="DENIED"' || true
      - name: Cluster log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ternrun-log
          path: ternfs/ternrun.log
          if-no-files-found: ignore
